# ============================================================
# Konfigurasi Mosquitto untuk Windows (Dry-Run di Laptop)
# Salin file ini ke: C:\mosquitto\mosquitto_decy13_windows.conf
#
# Cara menjalankan (PowerShell sebagai Administrator):
#   cd "C:\Program Files\mosquitto"
#   .\mosquitto.exe -c C:\mosquitto\mosquitto_decy13_windows.conf -v
#
# Atau tambahkan ke PATH lalu jalankan:
#   mosquitto -c "C:\path\ke\mosquitto_decy13_windows.conf" -v
# ============================================================

# Listener TCP (untuk paho-mqtt Python simulator)
listener 1883
protocol mqtt
allow_anonymous true

# Listener WebSocket (untuk browser Web HMI / MQTT.js)
listener 9001
protocol websockets
allow_anonymous true

# Log ke console (berguna untuk debug)
log_type all
log_dest stdout
