# Konfigurasi Mosquitto Broker untuk Siklotron DECY-13
# Simpan di /etc/mosquitto/conf.d/decy13.conf lalu jalankan: sudo systemctl restart mosquitto

allow_anonymous true

# Listener utama MQTT TCP (untuk Python Daemon di Raspberry Pi 3B+ & Node-RED)
listener 1883 0.0.0.0
protocol mqtt

# Listener MQTT untuk Web HMI Browser (Paho/MQTT.js)
listener 9001 0.0.0.0
protocol websockets
